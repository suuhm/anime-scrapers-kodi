name: Build & Release Kodi Addons and zip em softly...

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Create ZIPs
      run: |
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        echo "Tag version: $TAG_VERSION"
        
        for DIR in "Kodi 19+" "Kodi Legacy" XBMC; do
          if [ -d "$DIR" ]; then
            pushd "$DIR"
            for ADDON_DIR in */; do
              if [ -f "${ADDON_DIR}addon.xml" ]; then
                ADDON_NAME=$(basename "$ADDON_DIR")
                DIR_SUFFIX=$(echo "$DIR" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | sed 's/+//g')
                ZIP_NAME="../${ADDON_NAME}-${DIR_SUFFIX}-v${TAG_VERSION}.zip"
                zip -r "$ZIP_NAME" "$ADDON_DIR"
              fi
            done
            popd
          fi
        done
        
        ls -la *.zip
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          plugin.video.aniworld-kodi-19-v*.zip
          plugin.video.aniworld-kodi-legacy-v*.zip
          plugin.video.anixworld-xbmc-v*.zip
        generate_release_notes: true
