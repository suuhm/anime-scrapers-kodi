name: Build & Release Kodi Addons and zip em softly...

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Create all ZIPs
      run: |
        # Alle ZIPs im Root erstellen
        for DIR in "Kodi 19+" "Kodi Legacy" XBMC; do
          if [ -d "$DIR" ]; then
            echo "Processing $DIR"
            pushd "$DIR" > /dev/null
            
            for ADDON_DIR in */; do
              if [ -f "${ADDON_DIR}addon.xml" ]; then
                ADDON_NAME=$(basename "$ADDON_DIR")
                VERSION=$(grep '<version>' "${ADDON_DIR}addon.xml" | head -1 | sed -E 's/.*<version>([0-9.]+).*/\1/')
                
                DIR_SUFFIX=$(echo "$DIR" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | sed 's/+//g')
                ZIP_NAME="../${ADDON_NAME}-${DIR_SUFFIX}-v${VERSION}.zip"
                
                echo "Creating $ZIP_NAME from $ADDON_DIR"
                zip -r "$ZIP_NAME" "$ADDON_DIR"
              fi
            done
            
            popd > /dev/null
          fi
        done
        
        echo "=== ALL ZIPs created ==="
        ls -la *.zip || echo "No ZIPs in root"
        find . -name "*.zip" -type f
    
    - name: List final files
      run: find . -name "*.zip" -type f
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          plugin.video.*-*.zip
          *.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
