name: Build & Release Kodi Addons and zip em softly...

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Create ZIPs
      run: |
        mkdir -p release/
        
        for DIR in "Kodi 19+" "Kodi Legacy" XBMC; do
          if [ -d "$DIR" ]; then
            echo "Processing $DIR"
            cd "$DIR"
            
            for ADDON_DIR in */; do
              if [ -f "${ADDON_DIR}addon.xml" ]; then
                ADDON_NAME=$(basename "$ADDON_DIR")
                VERSION=$(grep '<version>' "${ADDON_DIR}addon.xml" | head -1 | sed -E 's/.*<version>([0-9.]+).*/\1/')
                
                DIR_SUFFIX=$(echo "$DIR" | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | sed 's/+//g')
                ZIP_NAME="../../release/${ADDON_NAME}-${DIR_SUFFIX}-v${VERSION}.zip"
                
                zip -r "$ZIP_NAME" "$ADDON_DIR"
                echo "Created: $ZIP_NAME"
              fi
            done
            cd ..
          fi
        done
        
        echo "All ZIPs:"
        ls -la release/
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release/*.zip
        generate_release_notes: true
